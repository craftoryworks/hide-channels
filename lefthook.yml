# Local git hooks (installed by `npm install` through the "prepare" script).
pre-commit:
  parallel: true
  jobs:
    - name: biome
      run: npx biome check --write --staged --no-errors-on-unmatched
      stage_fixed: true
    - name: secrets
      run: node scripts/gitleaks-staged.mjs

pre-push:
  jobs:
    - name: verify
      run: npm run verify
